[project]
name = "loa-font-tool"
version = "2.0.0"
description = "A simple GUI tool for modding fonts in Lost Ark by patching the font.lpk archive"
readme = "README.md"
requires-python = ">=3.13"
dependencies = []

[project.scripts]
loa-font-tool = "loa_font_tool.main:main"

[build-system]
requires = ["uv_build>=0.12.19,<0.13.0"]
build-backend = "uv_build"
